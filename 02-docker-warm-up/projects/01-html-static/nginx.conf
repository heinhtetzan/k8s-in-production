server {
    listen 80;
    server_name localhost;

    # /health (POST / GET) with system resource usage
    location = /health {
        default_type application/json;
        return 200 '{"message":"Service is healthy","data":{"status":"healthy","uptime_seconds":120,"memory_rss_mb":8.5,"platform":"linux"}}';
    }

    # /tasks and /tasts (purely stateless static data)
    location ~ ^/(tasks|tasts) {
        default_type application/json;
        if ($request_method = GET) {
            return 200 '{"message":"Tasks retrieved successfully","data":[{"id":1,"title":"Learn Kubernetes in Production","is_done":false,"created":"2026-10-26T07:00:00Z"}]}';
        }
        if ($request_method = POST) {
            return 200 '{"message":"Task created successfully","data":{"id":1,"title":"Learn Kubernetes in Production","is_done":false,"created":"2026-10-26T07:00:00Z"}}';
        }
        if ($request_method = PUT) {
            return 200 '{"message":"Task updated successfully","data":{"id":1,"title":"Learn Kubernetes in Production","is_done":false,"created":"2026-10-26T07:00:00Z"}}';
        }
        if ($request_method = PATCH) {
            return 200 '{"message":"Task patched successfully","data":{"id":1,"title":"Learn Kubernetes in Production","is_done":false,"created":"2026-10-26T07:00:00Z"}}';
        }
        if ($request_method = DELETE) {
            return 200 '{"message":"Task deleted successfully","data":{"id":1,"title":"Learn Kubernetes in Production","is_done":false,"created":"2026-10-26T07:00:00Z"}}';
        }
        return 200 '{"message":"Success","data":{"id":1,"title":"Learn Kubernetes in Production","is_done":false,"created":"2026-10-26T07:00:00Z"}}';
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
    }
}
