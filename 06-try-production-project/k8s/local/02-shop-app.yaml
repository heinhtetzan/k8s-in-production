# ==============================================================================
# 02. Shop Customer Storefront Service & Deployment (TanStack Start / React)
# ==============================================================================
# - Serves customer storefront on localhost:3000.
# - Connects internally to http://api-app-service:8000 for SSR and server queries.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-app
  labels:
    app: shop-app
    app.kubernetes.io/name: shop-app
    app.kubernetes.io/part-of: hello-k8s
    app.kubernetes.io/component: storefront
    environment: local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop-app
  template:
    metadata:
      labels:
        app: shop-app
    spec:
      containers:
        - name: shop-app
          image: shop-app:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: shop-config
                  key: SHOP_PORT
            - name: INTERNAL_API_URL
              valueFrom:
                configMapKeyRef:
                  name: shop-config
                  key: INTERNAL_API_URL
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: shop-config
                  key: NODE_ENV
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: shop-app-service
  labels:
    app: shop-app
    app.kubernetes.io/name: shop-app
    app.kubernetes.io/part-of: hello-k8s
    environment: local
spec:
  type: LoadBalancer
  selector:
    app: shop-app
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
