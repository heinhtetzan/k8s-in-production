# ==========================================
# 00. Database Credentials Secret Template
# ==========================================
# In production on AWS EKS, never commit plaintext passwords to Git.
#
# This file serves as a reference/declarative template.
# Generate the live secret dynamically from your Pulumi RDS output:
#
#   DATABASE_URL=$(pulumi stack output databaseUrl --show-secrets)
#
#   kubectl create secret generic postgres-secret \
#     --from-literal=POSTGRES_DB=shop \
#     --from-literal=POSTGRES_USER=shop \
#     --from-literal=POSTGRES_PASSWORD="asdffdsa" \
#     --from-literal=DATABASE_URL="$DATABASE_URL" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  labels:
    app.kubernetes.io/part-of: kendrick-shop
type: Opaque
stringData:
  POSTGRES_DB: "shop"
  POSTGRES_USER: "shop"
  POSTGRES_PASSWORD: "CHANGE_ME"
  DATABASE_URL: "postgresql://shop:CHANGE_ME@<RDS_ENDPOINT>:5432/shop?sslmode=require"
