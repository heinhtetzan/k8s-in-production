# ==============================================================================
# 01. Backend API Service & Deployment (Hono + Bun)
# ==============================================================================
# Architecture role:
# - Connects to AWS RDS PostgreSQL via DATABASE_URL from `postgres-secret`.
# - Provides REST API endpoints & OpenAPI Swagger documentation.
# - Consumed internally by `shop-app` and `shop-dashboard` at http://api-app-service:8000
# - Exposed externally to the internet via AWS Load Balancer at https://api.kendrickdev.shop
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-app
  labels:
    app: api-app
    app.kubernetes.io/name: api-app
    app.kubernetes.io/part-of: hello-k8s
    app.kubernetes.io/component: backend
spec:
  # Initial baseline replicas. When HPA (04-hpa.yaml) is active,
  # the Horizontal Pod Autoscaler dynamically adjusts this between 2 and 5 replicas.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # Spin up 1 new pod before terminating old ones
      maxUnavailable: 0    # Never allow running replicas to drop below desired count
  selector:
    matchLabels:
      app: api-app
  template:
    metadata:
      labels:
        app: api-app
    spec:
      terminationGracePeriodSeconds: 30 # Allow in-flight requests 30s to finish
      containers:
        - name: api-app
          image: 542601847638.dkr.ecr.ap-southeast-2.amazonaws.com/api-app:latest
          imagePullPolicy: Always
          lifecycle:
            preStop:
              exec:
                # 5s delay gives AWS ALB time to deregister the pod IP before process stops
                command: ["/bin/sh", "-c", "sleep 5"]
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: shop-config
                  key: API_PORT
            - name: DB_SSL
              valueFrom:
                configMapKeyRef:
                  name: shop-config
                  key: DB_SSL
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: shop-config
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              # Baseline allocation per pod. HPA uses these values to calculate utilization %:
              cpu: "100m"      # 0.1 vCPU
              memory: "128Mi"
            limits:
              # Maximum burst threshold before pod is throttled (CPU) or OOM-killed (Memory):
              cpu: "500m"      # 0.5 vCPU
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-app-service
  labels:
    app: api-app
    app.kubernetes.io/name: api-app
    app.kubernetes.io/part-of: hello-k8s
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:ap-southeast-2:542601847638:certificate/ca4e8033-f63c-461f-867d-96ab9cb887fc"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "https"
spec:
  type: LoadBalancer
  selector:
    app: api-app
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
    - name: https
      protocol: TCP
      port: 443
      targetPort: 8000

