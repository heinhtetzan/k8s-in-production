# ==============================================================================
# 01. Backend API Service & Deployment (Hono + Bun) - Local Dev
# ==============================================================================
# - Connects to local PostgreSQL via DATABASE_URL from `postgres-secret`.
# - Exposed to localhost:8000 via LoadBalancer service on Docker Desktop.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-app
  labels:
    app: api-app
    app.kubernetes.io/name: api-app
    app.kubernetes.io/part-of: hello-k8s
    app.kubernetes.io/component: backend
    environment: local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-app
  template:
    metadata:
      labels:
        app: api-app
    spec:
      containers:
        - name: api-app
          image: kendrick-shop-api:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: shop-config
                  key: API_PORT
            - name: DB_SSL
              valueFrom:
                configMapKeyRef:
                  name: shop-config
                  key: DB_SSL
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: shop-config
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-app-service
  labels:
    app: api-app
    app.kubernetes.io/name: api-app
    app.kubernetes.io/part-of: hello-k8s
    environment: local
spec:
  type: LoadBalancer
  selector:
    app: api-app
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
