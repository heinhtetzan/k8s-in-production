<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
<title id="title">Kubernetes cluster architecture</title><desc id="desc">A control plane communicates with two worker nodes. The control plane contains the API server, etcd, scheduler, and controllers. Worker nodes run kubelet, container runtime, and Pods.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#526581"/></marker></defs>
<rect width="1100" height="560" rx="24" fill="#f4f7fb"/><text x="550" y="46" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#15243a">Inside a Kubernetes cluster</text>
<rect x="44" y="90" width="340" height="410" rx="18" fill="#e5edff" stroke="#5978bd" stroke-width="2"/><text x="214" y="126" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#213b71">Control plane</text>
<rect x="79" y="151" width="270" height="63" rx="10" fill="#fff" stroke="#8da5d8"/><text x="214" y="178" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#20314d">API server</text><text x="214" y="199" text-anchor="middle" font-family="Arial" font-size="13" fill="#526581">Kubernetes API entry point</text>
<rect x="79" y="232" width="270" height="63" rx="10" fill="#fff" stroke="#8da5d8"/><text x="214" y="259" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#20314d">etcd</text><text x="214" y="280" text-anchor="middle" font-family="Arial" font-size="13" fill="#526581">Stores cluster state</text>
<rect x="79" y="313" width="270" height="63" rx="10" fill="#fff" stroke="#8da5d8"/><text x="214" y="340" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#20314d">Scheduler</text><text x="214" y="361" text-anchor="middle" font-family="Arial" font-size="13" fill="#526581">Selects a node for each Pod</text>
<rect x="79" y="394" width="270" height="63" rx="10" fill="#fff" stroke="#8da5d8"/><text x="214" y="421" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#20314d">Controllers</text><text x="214" y="442" text-anchor="middle" font-family="Arial" font-size="13" fill="#526581">Reconcile desired and actual state</text>
<rect x="442" y="90" width="285" height="410" rx="18" fill="#e1f5ed" stroke="#459b79" stroke-width="2"/><text x="584" y="126" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#176247">Worker node A</text>
<rect x="477" y="157" width="215" height="53" rx="10" fill="#fff" stroke="#79bda2"/><text x="584" y="190" text-anchor="middle" font-family="Arial" font-size="16" fill="#20314d">kubelet + runtime</text>
<rect x="477" y="237" width="215" height="81" rx="10" fill="#fff" stroke="#79bda2"/><text x="584" y="269" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#20314d">Pod</text><text x="584" y="294" text-anchor="middle" font-family="Arial" font-size="14" fill="#526581">app container</text>
<rect x="477" y="344" width="215" height="81" rx="10" fill="#fff" stroke="#79bda2"/><text x="584" y="376" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#20314d">Pod</text><text x="584" y="401" text-anchor="middle" font-family="Arial" font-size="14" fill="#526581">sidecar + app (optional)</text>
<rect x="785" y="90" width="270" height="410" rx="18" fill="#fff0df" stroke="#d79646" stroke-width="2"/><text x="920" y="126" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#805016">Worker node B</text>
<rect x="814" y="157" width="212" height="53" rx="10" fill="#fff" stroke="#dfb372"/><text x="920" y="190" text-anchor="middle" font-family="Arial" font-size="16" fill="#20314d">kubelet + runtime</text>
<rect x="814" y="237" width="212" height="81" rx="10" fill="#fff" stroke="#dfb372"/><text x="920" y="269" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#20314d">Pod</text><text x="920" y="294" text-anchor="middle" font-family="Arial" font-size="14" fill="#526581">app container</text>
<path d="M384 272 C408 272 415 272 442 272" fill="none" stroke="#526581" stroke-width="3" marker-end="url(#arrow)"/><path d="M384 312 C610 520 696 520 785 312" fill="none" stroke="#526581" stroke-width="3" marker-end="url(#arrow)"/><text x="550" y="536" text-anchor="middle" font-family="Arial" font-size="14" fill="#526581">API communication, scheduling, and status reporting</text>
</svg>
